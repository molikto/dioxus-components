[workspace]
resolver = "3"
members = ["primitives", "preview", "test-harness", "dioxus-attributes"]

[workspace.dependencies]
dioxus-primitives = { path = "primitives" }

# dioxus = "0.7.0"
# dioxus-rsx = "0.7.1"
dioxus = { git = "https://github.com/molikto/dioxus", branch = "my/main" }
dioxus-rsx = { git = "http://github.com/molikto/dioxus", branch = "my/main" }
tracing = { version = "0.1", features = ["std"] }

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false
